<VirtualHost *:80>
    ServerName cardvault.local
    ServerAlias 10.10.86.90

    # Point Apache to the public/ folder (the front controller)
    DocumentRoot /home/mahesh/Desktop/card-ai/public

    <Directory /home/mahesh/Desktop/card-ai/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logging
    ErrorLog  ${APACHE_LOG_DIR}/cardvault_error.log
    CustomLog ${APACHE_LOG_DIR}/cardvault_access.log combined

    # PHP settings for large image uploads
    <IfModule mod_php.c>
        php_value upload_max_filesize 20M
        php_value post_max_size       25M
        php_value max_execution_time  60
        php_value memory_limit        256M
    </IfModule>
</VirtualHost>
